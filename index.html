<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面付け計算ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body style="margin:0;padding:0;background:#F8FAFC;">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef } = React;

const PAPER_SIZES = [
  { label: "四六判", w: 788, h: 1091 },
  { label: "菊判",   w: 636, h: 939  },
  { label: "A列本判", w: 625, h: 880 },
  { label: "B列本判（JIS）", w: 765, h: 1085 },
  { label: "ハトロン判", w: 900, h: 1200 },
  { label: "A0", w: 841,  h: 1189 },
  { label: "A1", w: 594,  h: 841  },
  { label: "A2", w: 420,  h: 594  },
  { label: "A3", w: 297,  h: 420  },
  { label: "A4", w: 210,  h: 297  },
  { label: "A5", w: 148,  h: 210  },
  { label: "B0（JIS）", w: 1030, h: 1456 },
  { label: "B1（JIS）", w: 728,  h: 1030 },
  { label: "B2（JIS）", w: 515,  h: 728  },
  { label: "B3（JIS）", w: 364,  h: 515  },
  { label: "B4（JIS）", w: 257,  h: 364  },
  { label: "B5（JIS）", w: 182,  h: 257  },
  { label: "カスタム",  w: null, h: null  },
];

const CUTS = [
  { label: "全紙",   cols: 1, rows: 1 },
  { label: "２切",   cols: 2, rows: 1 },
  { label: "３切",   cols: 3, rows: 1 },
  { label: "４切",   cols: 2, rows: 2 },
  { label: "長３切", cols: 1, rows: 3 },
  { label: "６切",   cols: 3, rows: 2 },
  { label: "長６切", cols: 2, rows: 3 },
  { label: "８切",   cols: 4, rows: 2 },
  { label: "長８切", cols: 2, rows: 4 },
  { label: "９切",   cols: 3, rows: 3 },
  { label: "１２切", cols: 4, rows: 3 },
  { label: "１６切", cols: 4, rows: 4 },
];

const ZONE_COLORS = [
  { fill: "#BFDBFE", stroke: "#2563EB" },
  { fill: "#BBF7D0", stroke: "#16A34A" },
  { fill: "#FED7AA", stroke: "#EA580C" },
  { fill: "#E9D5FF", stroke: "#9333EA" },
  { fill: "#FEE2E2", stroke: "#DC2626" },
  { fill: "#CFFAFE", stroke: "#0891B2" },
  { fill: "#FEF9C3", stroke: "#CA8A04" },
  { fill: "#FCE7F3", stroke: "#DB2777" },
];

// ── 単品計算 ──────────────────────────────
function calcImposition({ paperW, paperH, designW, designH, bleed, kuwae, kuwaeJiri, marginLR, gutterH, gutterV }) {
  const effW = designW + 2 * bleed;
  const effH = designH + 2 * bleed;
  const usableW = paperW - 2 * marginLR;
  const usableH = paperH - kuwae - kuwaeJiri;
  if (effW <= 0 || effH <= 0 || usableW <= 0 || usableH <= 0) return null;
  const calc = (ew, eh) => {
    const cols = Math.max(0, Math.floor((usableW + gutterH) / (ew + gutterH)));
    const rows = Math.max(0, Math.floor((usableH + gutterV) / (eh + gutterV)));
    const count = cols * rows;
    const yld = count > 0 ? (count * ew * eh) / (paperW * paperH) * 100 : 0;
    return { cols, rows, count, yield: yld, effW: ew, effH: eh };
  };
  return { normal: calc(effW, effH), rotated: calc(effH, effW), usableW, usableH };
}

// ── 複数絵柄計算 ──────────────────────────
function calcMultiLayout(items, paperW, paperH, kuwae, kuwaeJiri, marginLR, gutterH, gutterV, zoneGap) {
  const usableW = paperW - 2 * marginLR;
  const usableH = paperH - kuwae - kuwaeJiri;
  if (usableW <= 0 || usableH <= 0) return null;

  // まず各ゾーンの基本サイズを計算
  const zones = items.map((item, idx) => {
    const dW = item.rotate90 ? item.h : item.w;
    const dH = item.rotate90 ? item.w : item.h;
    const effW = dW + 2 * item.bleed;
    const effH = dH + 2 * item.bleed;
    const zoneW = item.cols * effW + Math.max(0, item.cols - 1) * gutterH;
    const zoneH = item.rows * effH + Math.max(0, item.rows - 1) * gutterV;
    const count = item.cols * item.rows;
    const sheetsNeeded = count > 0 ? Math.ceil(item.copies / count) : 0;
    const yld = count > 0 ? (count * effW * effH) / (paperW * paperH) * 100 : 0;
    const color = ZONE_COLORS[idx % ZONE_COLORS.length];
    return { ...item, dW, dH, effW, effH, zoneW, zoneH, count, sheetsNeeded, yld, color, posX: 0, posY: 0 };
  });

  // 配置計算（placement: "new_row" | "beside" | "above"）
  let rowStartY = 0, currentX = 0, rowHeight = 0;
  zones.forEach((zone, i) => {
    const gap = i > 0 ? (zone.gapBefore ?? zoneGap) : 0;
    if (i === 0 || zone.placement === "new_row") {
      if (i > 0) rowStartY += rowHeight + gap;
      zone.posX = 0;
      zone.posY = rowStartY;
      currentX = zone.zoneW;
      rowHeight = zone.zoneH;
    } else if (zone.placement === "beside") {
      zone.posX = currentX + gap;
      zone.posY = rowStartY;
      currentX = zone.posX + zone.zoneW;
      rowHeight = Math.max(rowHeight, zone.zoneH);
    } else if (zone.placement === "above") {
      const prev = zones[i - 1];
      zone.posX = prev.posX;
      zone.posY = prev.posY - zone.zoneH - gap;
    }
  });

  // posYが負になった場合は全体を下にシフト
  const minPosY = Math.min(...zones.map(z => z.posY));
  if (minPosY < 0) zones.forEach(z => z.posY -= minPosY);

  // 行ごとのグループ（above は前ゾーンと同じ列なのでグループには含めない）
  let rowGroups = [];
  let currentGroup = [];
  zones.forEach((zone, i) => {
    if (zone.placement === "above" && i > 0) return;
    if (i === 0 || zone.placement === "new_row") {
      if (currentGroup.length > 0) rowGroups.push(currentGroup);
      currentGroup = [zone];
    } else if (zone.placement === "beside") {
      currentGroup.push(zone);
    }
  });
  if (currentGroup.length > 0) rowGroups.push(currentGroup);

  // 横センタリング + 行内下揃え
  rowGroups.forEach(group => {
    const rowW = group[group.length - 1].posX + group[group.length - 1].zoneW;
    const offset = Math.max(0, (usableW - rowW) / 2);
    const rowMaxH = Math.max(...group.map(z => z.zoneH));
    group.forEach(zone => {
      zone.posX += offset;
      zone.posY += rowMaxH - zone.zoneH;
    });
  });

  // row揃え後に "above" ゾーンのposY・posXを再計算
  zones.forEach((zone, i) => {
    if (zone.placement === "above" && i > 0) {
      const prev = zones[i - 1];
      const gap = zone.gapBefore ?? zoneGap;
      const hAlign = zone.hAlign ?? "left";
      if (hAlign === "right") {
        zone.posX = prev.posX + prev.zoneW - zone.zoneW;
      } else if (hAlign === "center") {
        zone.posX = prev.posX + (prev.zoneW - zone.zoneW) / 2;
      } else {
        zone.posX = prev.posX;
      }
      zone.posY = prev.posY - zone.zoneH - gap;
    }
  });

  // 再度ネガティブposYを補正
  const minPosY2 = Math.min(...zones.map(z => z.posY));
  if (minPosY2 < 0) zones.forEach(z => z.posY -= minPosY2);

  // 実際のバウンディングボックスからtotalZonesHを計算
  const totalZonesH = Math.max(...zones.map(z => z.posY + z.zoneH)) - Math.min(...zones.map(z => z.posY));

  // 縦方向：全ゾーン（aboveを含む）のバウンディングボックスの底をusableHに合わせる
  const allMaxBottom = Math.max(...zones.map(z => z.posY + z.zoneH));
  const allMinTop    = Math.min(...zones.map(z => z.posY));
  const totalH = allMaxBottom - allMinTop;
  // 全体をクワエ側（底）に揃える
  const shiftY2 = usableH - allMaxBottom;
  zones.forEach(zone => { zone.posY += shiftY2; });
  const maxRowW = zones.reduce((max, z) => Math.max(max, z.posX + z.zoneW), 0);
  const finalMinY = Math.min(...zones.map(z => z.posY));
  const finalMaxY = Math.max(...zones.map(z => z.posY + z.zoneH));
  const fits = finalMinY >= 0 && finalMaxY <= usableH && maxRowW <= usableW;
  const maxSheets = zones.length > 0 ? Math.max(...zones.map(z => z.sheetsNeeded)) : 0;
  const spareH = usableH - finalMaxY;

  return { zones, totalZonesH: finalMaxY - Math.max(0, finalMinY), maxRowW, usableW, usableH, fits, maxSheets, spareH };
}

// ── 単品プレビュー ────────────────────────
function LayoutPreview({ paperW, paperH, result, rotated, bleed, kuwae, kuwaeJiri, marginLR, gutterH, gutterV, centerLayout, manualCols, manualRows, showWarning, maxCols, maxRows, svgRef, spareCalc, colGutters, rowGutters, grain }) {
  const canvasW = 520, canvasH = 220, pad = 12;
  const scale = Math.min((canvasW - pad * 2) / paperW, (canvasH - pad * 2) / paperH);
  const pw = paperW * scale, ph = paperH * scale;
  const ox = pad + (canvasW - pad * 2 - pw) / 2;
  const oy = pad + (canvasH - pad * 2 - ph) / 2;

  const grainLines = [];
  const gs = 12, gc = "#94A3B8", gm = 3;
  if (grain === "tate") {
    for (let y = oy+gm+gs; y < oy+ph-gm; y += gs) grainLines.push(<line key={y} x1={ox+gm} y1={y} x2={ox+pw-gm} y2={y} stroke={gc} strokeWidth={0.7} opacity={0.6}/>);
  } else {
    for (let x = ox+gm+gs; x < ox+pw-gm; x += gs) grainLines.push(<line key={x} x1={x} y1={oy+gm} x2={x} y2={oy+ph-gm} stroke={gc} strokeWidth={0.7} opacity={0.6}/>);
  }

  const mKuwae = kuwae * scale, mKuwaeJ = kuwaeJiri * scale, mLR = marginLR * scale;
  const uw = result ? result.usableW * scale : pw - mLR * 2;
  const uh = result ? result.usableH * scale : ph - mKuwae - mKuwaeJ;
  const noFit = !result || result.count === 0;
  const base = result ? (rotated ? result.rotated : result.normal) : null;
  const cols = base ? Math.min(manualCols, base.cols) : 0;
  const rows = base ? Math.min(manualRows, base.rows) : 0;

  const cells = [];
  let spareL = 0, spareR = 0, spareT = 0, spareB = 0;

  if (base && cols > 0 && rows > 0) {
    const iw = base.effW * scale, ih = base.effH * scale;
    const cg = (colGutters && colGutters.length === cols-1) ? colGutters.map(g => g*scale) : Array(Math.max(0,cols-1)).fill(gutterH*scale);
    const rg = (rowGutters && rowGutters.length === rows-1) ? rowGutters.map(g => g*scale) : Array(Math.max(0,rows-1)).fill(gutterV*scale);
    const totalW = cols*iw + cg.reduce((a,b)=>a+b,0);
    const totalH = rows*ih + rg.reduce((a,b)=>a+b,0);
    const spareWpx = uw - totalW, spareHpx = uh - totalH;
    const offX = spareCalc ? spareCalc.offX*scale : spareWpx/2;
    const offY = spareCalc ? spareCalc.offY*scale : (centerLayout ? spareHpx/2 : spareHpx);
    spareL = spareCalc ? spareCalc.leftMm : Math.round(offX/scale*10)/10;
    spareR = spareCalc ? spareCalc.rightMm : Math.round((spareWpx-offX)/scale*10)/10;
    spareT = spareCalc ? spareCalc.topMm : Math.round(offY/scale*10)/10;
    spareB = spareCalc ? spareCalc.bottomMm : Math.round((spareHpx-offY)/scale*10)/10;
    const startX = ox+mLR+offX, startY = oy+mKuwaeJ+offY;
    const colX = [0]; for (let c=0;c<cols-1;c++) colX.push(colX[c]+iw+cg[c]);
    const rowY = [0]; for (let r=0;r<rows-1;r++) rowY.push(rowY[r]+ih+rg[r]);
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) cells.push({x:startX+colX[c],y:startY+rowY[r],iw,ih});
  }

  const bp = bleed*scale;
  const usableX = ox+mLR, usableY = oy+mKuwaeJ;
  const cellsLeft = cells.length>0 ? cells[0].x : usableX;
  const cellsTop = cells.length>0 ? cells[0].y : usableY;
  const cellsRight = cells.length>0 ? cells[cells.length-1].x+cells[cells.length-1].iw : usableX+uw;
  const cellsBottom = cells.length>0 ? cells[cells.length-1].y+cells[cells.length-1].ih : usableY;

  const mmLabel = (x,y,val) => {
    if (val===0) return null;
    const txt = val+"mm", w = Math.max(32,txt.length*7+8);
    return <g><rect x={x-w/2} y={y-8} width={w} height={15} rx={2} fill="white" fillOpacity={0.9}/><text x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize={11} fontWeight="600" fill="#92400E">{txt}</text></g>;
  };

  return (
    <div>
      <svg ref={svgRef} width={canvasW} height={canvasH} style={{display:"block",background:"#fff"}}>
        <rect x={0} y={0} width={canvasW} height={canvasH} fill="#fff"/>
        <rect x={ox} y={oy} width={pw} height={ph} fill="#fff" stroke="#E24B4A" strokeWidth={1.5}/>
        {grainLines}
        {mLR>0.5 && <><rect x={ox} y={oy} width={mLR} height={ph} fill="#E24B4A" fillOpacity={0.08}/><rect x={ox+pw-mLR} y={oy} width={mLR} height={ph} fill="#E24B4A" fillOpacity={0.08}/></>}
        {mKuwaeJ>0.5 && <rect x={ox} y={oy} width={pw} height={mKuwaeJ} fill="#94A3B8" fillOpacity={0.15}/>}
        {mKuwae>0.5 && <rect x={ox} y={oy+ph-mKuwae} width={pw} height={mKuwae} fill="#E24B4A" fillOpacity={0.12}/>}
        <rect x={usableX} y={usableY} width={uw} height={uh} fill="none" stroke="#CBD5E1" strokeWidth={0.5} strokeDasharray="4 2"/>
        {cells.length>0 && spareT*scale>1 && <rect x={usableX} y={usableY} width={uw} height={spareT*scale} fill="#F59E0B" fillOpacity={0.15}/>}
        {cells.length>0 && spareB*scale>1 && <rect x={usableX} y={cellsBottom} width={uw} height={spareB*scale} fill="#F59E0B" fillOpacity={0.15}/>}
        {cells.length>0 && spareL*scale>1 && <rect x={usableX} y={cellsTop} width={spareL*scale} height={cellsBottom-cellsTop} fill="#F59E0B" fillOpacity={0.15}/>}
        {cells.length>0 && spareR*scale>1 && <rect x={cellsRight} y={cellsTop} width={spareR*scale} height={cellsBottom-cellsTop} fill="#F59E0B" fillOpacity={0.15}/>}
        {cells.map((c,i) => {
          const fw=c.iw-bp*2, fh=c.ih-bp*2;
          return <g key={i}>
            {bleed>0 && <rect x={c.x} y={c.y} width={c.iw} height={c.ih} fill="#E8ECF0" fillOpacity={0.5} stroke="#94A3B8" strokeWidth={0.4} strokeDasharray="2 1"/>}
            {fw>0.5&&fh>0.5 && <rect x={c.x+bp} y={c.y+bp} width={fw} height={fh} fill="#E8ECF0" stroke="#64748B" strokeWidth={0.8}/>}
            {bleed===0 && <rect x={c.x} y={c.y} width={c.iw} height={c.ih} fill="#E8ECF0" stroke="#64748B" strokeWidth={0.8}/>}
          </g>;
        })}
        {cells.length>0 && spareL>0 && mmLabel(usableX+spareL*scale/2, cellsTop+(cellsBottom-cellsTop)/2, spareL)}
        {cells.length>0 && spareR>0 && mmLabel(cellsRight+spareR*scale/2, cellsTop+(cellsBottom-cellsTop)/2, spareR)}
        {cells.length>0 && spareT>0 && mmLabel(usableX+uw/2, usableY+spareT*scale/2, spareT)}
        {cells.length>0 && spareB>0 && mmLabel(usableX+uw/2, cellsBottom+spareB*scale/2, spareB)}
        {mKuwae>4 && <text x={ox+pw/2} y={oy+ph-mKuwae/2} textAnchor="middle" dominantBaseline="middle" fontSize={10} fill="#991B1B">クワエ {kuwae}mm</text>}
        {mKuwaeJ>4 && <text x={ox+pw/2} y={oy+mKuwaeJ/2} textAnchor="middle" dominantBaseline="middle" fontSize={10} fill="#475569">クワエ尻 {kuwaeJiri}mm</text>}
        {noFit && <text x={ox+pw/2} y={oy+ph/2} textAnchor="middle" dominantBaseline="middle" fontSize={12} fill="#94A3B8">収まりません</text>}
        {showWarning && <g><rect x={0} y={0} width={canvasW} height={28} fill="#FEF2F2"/><rect x={0} y={27} width={canvasW} height={1} fill="#FECACA"/><text x={canvasW/2} y={14} textAnchor="middle" dominantBaseline="middle" fontSize={11} fontWeight="600" fill="#DC2626">⚠ 指定面数が紙に収まりません（最大: 横{maxCols} × 縦{maxRows}）に丸めて表示中</text></g>}
      </svg>
      {cells.length>0 && (
        <div style={{marginTop:8,display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4}}>
          {[["左空き",spareL],["右空き",spareR],["上空き",spareT],["下空き",spareB]].map(([label,val]) => (
            <div key={label} style={{background:val>0?"#FEF3C7":"#F1F5F9",border:`0.5px solid ${val>0?"#FCD34D":"#E2E8F0"}`,borderRadius:4,padding:"3px 6px",textAlign:"center"}}>
              <div style={{fontSize:10,color:val>0?"#92400E":"#94A3B8"}}>{label}</div>
              <div style={{fontWeight:600,fontSize:12,color:val>0?"#78350F":"#94A3B8"}}>{val} mm</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── 複数絵柄プレビュー ────────────────────
function MultiLayoutPreview({ paperW, paperH, multiLayout, kuwae, kuwaeJiri, marginLR, gutterH, gutterV, zoneGap, grain }) {
  const canvasW = 520, canvasH = 280, pad = 12;
  const scale = Math.min((canvasW-pad*2)/paperW, (canvasH-pad*2)/paperH);
  const pw = paperW*scale, ph = paperH*scale;
  const ox = pad+(canvasW-pad*2-pw)/2;
  const oy = pad+(canvasH-pad*2-ph)/2;
  const mK = kuwae*scale, mKJ = kuwaeJiri*scale, mLR = marginLR*scale;
  const usableX = ox+mLR, usableY = oy+mKJ;
  const uw = multiLayout ? multiLayout.usableW*scale : pw-mLR*2;
  const uh = multiLayout ? multiLayout.usableH*scale : ph-mK-mKJ;

  const grainLines = [];
  const gs = 12, gc = "#94A3B8", gm = 3;
  if (grain==="tate") {
    for (let y=oy+gm+gs; y<oy+ph-gm; y+=gs) grainLines.push(<line key={y} x1={ox+gm} y1={y} x2={ox+pw-gm} y2={y} stroke={gc} strokeWidth={0.7} opacity={0.5}/>);
  } else {
    for (let x=ox+gm+gs; x<ox+pw-gm; x+=gs) grainLines.push(<line key={x} x1={x} y1={oy+gm} x2={x} y2={oy+ph-gm} stroke={gc} strokeWidth={0.7} opacity={0.5}/>);
  }

  return (
    <div>
      <svg width={canvasW} height={canvasH} style={{display:"block",background:"#fff"}}>
        <rect x={0} y={0} width={canvasW} height={canvasH} fill="#fff"/>
        <rect x={ox} y={oy} width={pw} height={ph} fill="#fff" stroke="#E24B4A" strokeWidth={1.5}/>
        {grainLines}
        {mLR>0.5 && <><rect x={ox} y={oy} width={mLR} height={ph} fill="#E24B4A" fillOpacity={0.08}/><rect x={ox+pw-mLR} y={oy} width={mLR} height={ph} fill="#E24B4A" fillOpacity={0.08}/></>}
        {mKJ>0.5 && <rect x={ox} y={oy} width={pw} height={mKJ} fill="#94A3B8" fillOpacity={0.15}/>}
        {mK>0.5 && <rect x={ox} y={oy+ph-mK} width={pw} height={mK} fill="#E24B4A" fillOpacity={0.12}/>}
        <rect x={usableX} y={usableY} width={uw} height={uh} fill="none" stroke="#CBD5E1" strokeWidth={0.5} strokeDasharray="4 2"/>
        {multiLayout && multiLayout.zones.map((zone, zi) => {
          const zX = usableX + zone.posX * scale;
          const zY = usableY + zone.posY * scale;
          const zW = zone.zoneW * scale;
          const zH = zone.zoneH * scale;
          const iw = zone.effW * scale, ih = zone.effH * scale;
          const gH = gutterH * scale, gV = gutterV * scale;
          const bp = zone.bleed * scale;
          return (
            <g key={zone.id}>
              <rect x={zX} y={zY} width={zW} height={zH} fill={zone.color.fill} fillOpacity={0.2}/>
              {Array.from({length:zone.rows}).map((_,r) =>
                Array.from({length:zone.cols}).map((_,c) => {
                  const cx = zX + c*(iw+gH);
                  const cy = zY + r*(ih+gV);
                  return <g key={`${r}-${c}`}>
                    {zone.bleed>0 && <rect x={cx} y={cy} width={iw} height={ih} fill={zone.color.fill} fillOpacity={0.4} stroke={zone.color.stroke} strokeWidth={0.4} strokeDasharray="2 1"/>}
                    <rect x={cx+bp} y={cy+bp} width={Math.max(0,iw-bp*2)} height={Math.max(0,ih-bp*2)} fill={zone.color.fill} fillOpacity={0.85} stroke={zone.color.stroke} strokeWidth={0.9}/>
                    {zone.bleed===0 && <rect x={cx} y={cy} width={iw} height={ih} fill={zone.color.fill} fillOpacity={0.85} stroke={zone.color.stroke} strokeWidth={0.9}/>}
                  </g>;
                })
              )}
              <rect x={zX+3} y={zY+3} width={52} height={15} rx={2} fill={zone.color.stroke} fillOpacity={0.9}/>
              <text x={zX+29} y={zY+10} textAnchor="middle" dominantBaseline="middle" fontSize={9} fill="white" fontWeight="700">{zone.name}</text>
            </g>
          );
        })}
        {mK>4 && <text x={ox+pw/2} y={oy+ph-mK/2} textAnchor="middle" dominantBaseline="middle" fontSize={10} fill="#991B1B">クワエ {kuwae}mm</text>}
        {mKJ>4 && <text x={ox+pw/2} y={oy+mKJ/2} textAnchor="middle" dominantBaseline="middle" fontSize={10} fill="#475569">クワエ尻 {kuwaeJiri}mm</text>}
        {multiLayout && !multiLayout.fits && (() => {
          const finalMinY = Math.min(...multiLayout.zones.map(z => z.posY));
          const finalMaxY = Math.max(...multiLayout.zones.map(z => z.posY + z.zoneH));
          const overTop = finalMinY < 0 ? Math.round(-finalMinY) : 0;
          const overBottom = finalMaxY > multiLayout.usableH ? Math.round(finalMaxY - multiLayout.usableH) : 0;
          const msg = [
            overTop > 0 ? `上に${overTop}mmはみ出しています` : "",
            overBottom > 0 ? `下に${overBottom}mmはみ出しています` : "",
          ].filter(Boolean).join("　");
          return (
            <g>
              <rect x={0} y={0} width={canvasW} height={28} fill="#FEF2F2"/>
              <rect x={0} y={27} width={canvasW} height={1} fill="#FECACA"/>
              <text x={canvasW/2} y={14} textAnchor="middle" dominantBaseline="middle" fontSize={11} fontWeight="600" fill="#DC2626">
                ⚠ {msg || "有効面積を超えています"}
              </text>
            </g>
          );
        })()}
        {multiLayout && multiLayout.fits && (() => {
          // 全ゾーンのboundingBox計算
          const minX = Math.min(...multiLayout.zones.map(z => z.posX));
          const maxX = Math.max(...multiLayout.zones.map(z => z.posX + z.zoneW));
          const minY = Math.min(...multiLayout.zones.map(z => z.posY));
          const maxY = Math.max(...multiLayout.zones.map(z => z.posY + z.zoneH));
          const spL = Math.round(minX * 10) / 10;
          const spR = Math.round((multiLayout.usableW - maxX) * 10) / 10;
          const spT = Math.round(minY * 10) / 10;
          const spB = Math.round((multiLayout.usableH - maxY) * 10) / 10;
          const lx = usableX + minX*scale, rx = usableX + maxX*scale;
          const ty = usableY + minY*scale, by = usableY + maxY*scale;
          const midH = (ty + by) / 2, midW = (lx + rx) / 2;
          const mm = (x,y,val) => { if(val<=0) return null; const t=val+"mm",w=Math.max(32,t.length*7+8); return <g><rect x={x-w/2} y={y-8} width={w} height={15} rx={2} fill="white" fillOpacity={0.92}/><text x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize={11} fontWeight="600" fill="#92400E">{t}</text></g>; };
          return <g>
            {spL>0 && <rect x={usableX} y={ty} width={spL*scale} height={by-ty} fill="#F59E0B" fillOpacity={0.15}/>}
            {spR>0 && <rect x={rx} y={ty} width={spR*scale} height={by-ty} fill="#F59E0B" fillOpacity={0.15}/>}
            {spT>0 && <rect x={usableX} y={usableY} width={uw} height={spT*scale} fill="#F59E0B" fillOpacity={0.15}/>}
            {spB>0 && <rect x={usableX} y={by} width={uw} height={spB*scale} fill="#F59E0B" fillOpacity={0.15}/>}
            {mm(usableX+spL*scale/2, midH, spL)}
            {mm(rx+spR*scale/2, midH, spR)}
            {mm(midW, usableY+spT*scale/2, spT)}
            {mm(midW, by+spB*scale/2, spB)}
          </g>;
        })()}
      </svg>
      {multiLayout && multiLayout.fits && (() => {
        const minX = Math.min(...multiLayout.zones.map(z => z.posX));
        const maxX = Math.max(...multiLayout.zones.map(z => z.posX + z.zoneW));
        const minY = Math.min(...multiLayout.zones.map(z => z.posY));
        const maxY = Math.max(...multiLayout.zones.map(z => z.posY + z.zoneH));
        const badges = [
          ["左空き", Math.round(minX*10)/10],
          ["右空き", Math.round((multiLayout.usableW-maxX)*10)/10],
          ["上空き", Math.round(minY*10)/10],
          ["下空き", Math.round((multiLayout.usableH-maxY)*10)/10],
        ];
        return (
          <div style={{marginTop:8,display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4}}>
            {badges.map(([label,val]) => (
              <div key={label} style={{background:val>0?"#FEF3C7":"#F1F5F9",border:`0.5px solid ${val>0?"#FCD34D":"#E2E8F0"}`,borderRadius:4,padding:"3px 6px",textAlign:"center"}}>
                <div style={{fontSize:10,color:val>0?"#92400E":"#94A3B8"}}>{label}</div>
                <div style={{fontWeight:600,fontSize:12,color:val>0?"#78350F":"#94A3B8"}}>{val} mm</div>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

// ── UI部品 ────────────────────────────────
const SLabel = ({c}) => <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:8,letterSpacing:"0.05em",textTransform:"uppercase"}}>{c}</div>;
const FLabel = ({c}) => <div style={{fontSize:11,color:"#94A3B8",marginBottom:3}}>{c}</div>;
const Card   = ({children,highlight}) => (
  <div style={{background:"#fff",border:highlight?"2px solid #3B82F6":"1px solid #E2E8F0",borderRadius:8,padding:"1rem 1.25rem",position:"relative",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
    {children}
  </div>
);

// ── メインアプリ ──────────────────────────
function App() {
  // 紙サイズ
  const [paperPreset, setPaperPreset] = useState(0);
  const [customW, setCustomW]         = useState(500);
  const [customH, setCustomH]         = useState(700);
  const [grain, setGrain]             = useState("tate");
  // 断裁
  const [cutIdx, setCutIdx]           = useState(0);
  // 余白
  const [kuwae, setKuwae]             = useState(0);
  const [kuwaeJiri, setKuwaeJiri]     = useState(0);
  const [marginLR, setMarginLR]       = useState(0);
  const [gutterH, setGutterH]         = useState(0);
  const [gutterV, setGutterV]         = useState(0);

  // 付け合わせモード
  const [impositionMode, setImpositionMode] = useState("single"); // "single" | "multi"

  // ── 単品モード用 ──
  const [designW, setDesignW]         = useState(210);
  const [designH, setDesignH]         = useState(297);
  const [bleed, setBleed]             = useState(0);
  const [rotate90, setRotate90]       = useState(false);
  const [manualCols, setManualCols]   = useState(4);
  const [manualRows, setManualRows]   = useState(2);
  const [manualRotated, setManualRotated] = useState(false);
  const [copies, setCopies]           = useState(1000);
  const [gutterMode, setGutterMode]   = useState("uniform");
  const [customColGutters, setCustomColGutters] = useState([]);
  const [customRowGutters, setCustomRowGutters] = useState([]);
  const [centerLayout, setCenterLayout] = useState(false);
  const [offsetMode, setOffsetMode]   = useState("auto");
  const [offsetXmm, setOffsetXmm]     = useState(0);
  const [offsetYmm, setOffsetYmm]     = useState(0);
  const svgRef = useRef(null);

  // ── 複数絵柄モード用 ──
  const [multiItems, setMultiItems] = useState([
    { id: 1, name: "絵柄A", w: 91,  h: 55,  bleed: 0, copies: 1000, rotate90: false, cols: 4, rows: 2, placement: "new_row", gapBefore: 0, hAlign: "left" },
    { id: 2, name: "絵柄B", w: 148, h: 100, bleed: 0, copies: 500,  rotate90: false, cols: 3, rows: 1, placement: "new_row", gapBefore: 0, hAlign: "left" },
  ]);
  const [zoneGap, setZoneGap] = useState(0);

  const addMultiItem = () => {
    const idx = multiItems.length;
    const name = `絵柄${"ABCDEFGHIJKLMNOPQRSTUVWXYZ"[idx] || idx+1}`;
    setMultiItems(prev => [...prev, { id: Date.now(), name, w: 100, h: 100, bleed: 0, copies: 1000, rotate90: false, cols: 1, rows: 1, placement: "new_row", gapBefore: 0, hAlign: "left" }]);
  };
  const removeMultiItem = (id) => setMultiItems(prev => prev.filter(i => i.id !== id));
  const updateMultiItem = (id, key, val) => setMultiItems(prev => prev.map(i => i.id===id ? {...i,[key]:val} : i));

  // 紙サイズ
  const preset  = PAPER_SIZES[paperPreset];
  const baseW   = preset.w ?? customW;
  const baseH   = preset.h ?? customH;
  const grainW  = grain==="tate" ? baseW : baseH;
  const grainH  = grain==="tate" ? baseH : baseW;
  const fullW   = Math.max(grainW, grainH);
  const fullH   = Math.min(grainW, grainH);
  const cut     = CUTS[cutIdx];
  const cutRawW = Math.round(fullW/cut.cols);
  const cutRawH = Math.round(fullH/cut.rows);
  const paperW  = Math.max(cutRawW, cutRawH);
  const paperH  = Math.min(cutRawW, cutRawH);
  const cutRotated = cutRawW < cutRawH;
  const effectiveGrain = cutRotated ? (grain==="tate"?"yoko":"tate") : grain;

  // 単品計算
  const dW = rotate90 ? designH : designW;
  const dH = rotate90 ? designW : designH;
  const result = useMemo(() =>
    impositionMode==="single" ? calcImposition({paperW,paperH,designW:dW,designH:dH,bleed,kuwae,kuwaeJiri,marginLR,gutterH,gutterV}) : null,
    [impositionMode,paperW,paperH,dW,dH,bleed,kuwae,kuwaeJiri,marginLR,gutterH,gutterV]
  );
  const bestMode = result && result.normal.count>=result.rotated.count ? "normal" : "rotated";
  const manualBase = result ? (manualRotated ? result.rotated : result.normal) : null;
  const clampedCols = manualBase ? Math.min(manualCols, manualBase.cols) : manualCols;
  const clampedRows = manualBase ? Math.min(manualRows, manualBase.rows) : manualRows;
  const manualCount = clampedCols * clampedRows;
  const manualYield = manualBase && manualCount>0 ? (manualCount*manualBase.effW*manualBase.effH)/(paperW*paperH)*100 : 0;

  const nColGaps = Math.max(0, clampedCols-1);
  const nRowGaps = Math.max(0, clampedRows-1);
  const activeColGutters = useMemo(() => gutterMode==="custom"&&customColGutters.length===nColGaps ? customColGutters : Array(nColGaps).fill(gutterH), [gutterMode,customColGutters,nColGaps,gutterH]);
  const activeRowGutters = useMemo(() => gutterMode==="custom"&&customRowGutters.length===nRowGaps ? customRowGutters : Array(nRowGaps).fill(gutterV), [gutterMode,customRowGutters,nRowGaps,gutterV]);

  const switchToCustomGutter = () => { setCustomColGutters(Array(nColGaps).fill(gutterH)); setCustomRowGutters(Array(nRowGaps).fill(gutterV)); setGutterMode("custom"); };
  const updateColGutter = (i,val) => { const a=[...activeColGutters]; a[i]=Math.max(0,val); setCustomColGutters(a); };
  const updateRowGutter = (i,val) => { const a=[...activeRowGutters]; a[i]=Math.max(0,val); setCustomRowGutters(a); };

  const spareCalc = useMemo(() => {
    if (!manualBase||clampedCols===0||clampedRows===0||!result) return null;
    const sumColG = activeColGutters.reduce((a,b)=>a+b,0);
    const sumRowG = activeRowGutters.reduce((a,b)=>a+b,0);
    const totalW = clampedCols*manualBase.effW+sumColG;
    const totalH = clampedRows*manualBase.effH+sumRowG;
    const spareW = Math.max(0, result.usableW-totalW);
    const spareH = Math.max(0, result.usableH-totalH);
    let offX, offY;
    if (offsetMode==="manual") { offX=Math.min(Math.max(0,offsetXmm),spareW); offY=Math.min(Math.max(0,offsetYmm),spareH); }
    else { offX=spareW/2; offY=centerLayout?spareH/2:spareH; }
    return { offX,offY,spareW,spareH, leftMm:Math.round(offX*10)/10, rightMm:Math.round((spareW-offX)*10)/10, topMm:Math.round(offY*10)/10, bottomMm:Math.round((spareH-offY)*10)/10 };
  }, [manualBase,clampedCols,clampedRows,result,activeColGutters,activeRowGutters,offsetMode,offsetXmm,offsetYmm,centerLayout]);

  // 複数絵柄計算
  const multiLayout = useMemo(() =>
    impositionMode==="multi" ? calcMultiLayout(multiItems,paperW,paperH,kuwae,kuwaeJiri,marginLR,gutterH,gutterV,zoneGap) : null,
    [impositionMode,multiItems,paperW,paperH,kuwae,kuwaeJiri,marginLR,gutterH,gutterV,zoneGap]
  );

  // エクスポート（単品）
  const exportImage = (format) => {
    const SW=300,PW=600,PH=260,W=SW+PW+20,H=PH+140;
    const canvas=document.createElement("canvas");
    canvas.width=W*2; canvas.height=H*2;
    const ctx=canvas.getContext("2d");
    ctx.scale(2,2);
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#0F172A"; ctx.font="bold 15px sans-serif"; ctx.fillText("面付け計算結果",16,28);
    ctx.fillStyle="#94A3B8"; ctx.font="10px sans-serif"; ctx.fillText(new Date().toLocaleString("ja-JP"),16,44);
    ctx.strokeStyle="#E2E8F0"; ctx.beginPath(); ctx.moveTo(12,52); ctx.lineTo(W-12,52); ctx.stroke();
    const rows2=[["用紙",`${preset.label}（${grain==="tate"?"タテ目":"ヨコ目"}）`],["断裁",`${cut.label} / 断裁後 ${paperW}×${paperH}mm`],["製品サイズ",`${dW}×${dH}mm${bleed>0?` / ドブ ${bleed}mm`:""}`],["クワエ",`下${kuwae}mm / 上${kuwaeJiri}mm`],["左右余白",`${marginLR}mm`],["送り",`横${gutterH}mm / 縦${gutterV}mm`],["面付け",`横${clampedCols}×縦${clampedRows} = ${manualCount}面`],["必要用紙",`${manualCount>0?Math.ceil(copies/manualCount).toLocaleString():"―"}枚 / ${copies.toLocaleString()}部`],["歩留まり",`${manualYield.toFixed(1)}%`]];
    ctx.font="bold 10px sans-serif"; ctx.fillStyle="#475569"; ctx.fillText("■ 設定値",16,68);
    rows2.forEach(([label,val],i) => { const y=80+i*22; ctx.fillStyle=i%2===0?"#F8FAFC":"#fff"; ctx.fillRect(12,y-8,SW-10,20); ctx.fillStyle="#94A3B8"; ctx.font="9px sans-serif"; ctx.fillText(label,16,y+5); ctx.fillStyle="#1E293B"; ctx.font="10px sans-serif"; ctx.fillText(val,82,y+5); });
    ctx.strokeStyle="#E2E8F0"; ctx.beginPath(); ctx.moveTo(SW+4,56); ctx.lineTo(SW+4,H-12); ctx.stroke();
    const pad=10,ox0=SW+14+pad,oy0=62+pad,scale=Math.min((PW-pad*2)/paperW,(PH-pad*2)/paperH);
    const pw=paperW*scale,ph=paperH*scale,ox=ox0+(PW-pad*2-pw)/2,oy=oy0+(PH-pad*2-ph)/2;
    ctx.fillStyle="#fff"; ctx.fillRect(ox,oy,pw,ph); ctx.strokeStyle="#E24B4A"; ctx.lineWidth=1.5; ctx.strokeRect(ox,oy,pw,ph);
    const mK=kuwae*scale,mKJ=kuwaeJiri*scale,mLR2=marginLR*scale;
    const uw=(paperW-2*marginLR)*scale,uh=(paperH-kuwae-kuwaeJiri)*scale;
    if(mKJ>0){ctx.fillStyle="rgba(148,163,184,0.15)";ctx.fillRect(ox,oy,pw,mKJ);}
    if(mK>0){ctx.fillStyle="rgba(226,75,74,0.12)";ctx.fillRect(ox,oy+ph-mK,pw,mK);}
    if(mLR2>0){ctx.fillStyle="rgba(226,75,74,0.08)";ctx.fillRect(ox,oy,mLR2,ph);ctx.fillRect(ox+pw-mLR2,oy,mLR2,ph);}
    if(manualBase&&clampedCols>0&&clampedRows>0){
      const iw=manualBase.effW*scale,ih=manualBase.effH*scale,gH=gutterH*scale,gV=gutterV*scale;
      const totalW2=clampedCols*iw+(clampedCols-1)*gH,totalH2=clampedRows*ih+(clampedRows-1)*gV;
      const spW=uw-totalW2,spH=uh-totalH2;
      const offX=spareCalc?spareCalc.offX*scale:spW/2,offY=spareCalc?spareCalc.offY*scale:spH;
      const startX=ox+mLR2+offX,startY=oy+mKJ+offY,bp=bleed*scale;
      ctx.fillStyle="rgba(245,158,11,0.15)";
      if(offY>0.5)ctx.fillRect(ox+mLR2,oy+mKJ,uw,offY);
      if(spH-offY>0.5)ctx.fillRect(ox+mLR2,startY+totalH2,uw,spH-offY);
      if(offX>0.5)ctx.fillRect(ox+mLR2,startY,offX,totalH2);
      if(spW-offX>0.5)ctx.fillRect(startX+totalW2,startY,spW-offX,totalH2);
      for(let r=0;r<clampedRows;r++)for(let c=0;c<clampedCols;c++){
        const cx=startX+c*(iw+gH),cy=startY+r*(ih+gV);
        ctx.fillStyle="#E8ECF0";ctx.fillRect(cx+bp,cy+bp,iw-bp*2,ih-bp*2);
        ctx.strokeStyle="#64748B";ctx.lineWidth=0.8;ctx.strokeRect(cx+bp,cy+bp,iw-bp*2,ih-bp*2);
      }
    }
    ctx.fillStyle="#475569";ctx.font="bold 10px sans-serif";ctx.fillText("■ レイアウトプレビュー",SW+14,58);
    const dateStr=new Date().toLocaleDateString("ja-JP").replace(/\//g,"-");
    if(format==="pdf"){
      const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload=()=>{const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});pdf.addImage(canvas.toDataURL("image/png"),"PNG",5,5,287,287*(H*2)/(W*2));pdf.save(`面付け計算_${dateStr}.pdf`);};
      document.head.appendChild(s);
    } else {
      const a=document.createElement("a");a.download=`面付け計算_${dateStr}.${format}`;a.href=canvas.toDataURL(format==="jpeg"?"image/jpeg":"image/png",0.95);a.click();
    }
  };

  const inp = (val,set,min=0) => <input type="number" min={min} step={1} value={val} onChange={e=>set(Math.max(min,Number(e.target.value)))} className="imp-input"/>;
  const rbStyle = active => ({display:"inline-flex",alignItems:"center",gap:4,cursor:"pointer",fontSize:12,padding:"3px 10px",background:active?"#EFF6FF":"#F8FAFC",color:active?"#1D4ED8":"#64748B",border:`1.5px solid ${active?"#93C5FD":"#E2E8F0"}`,borderRadius:6,userSelect:"none",fontWeight:active?600:400});

  return (
    <div style={{fontFamily:"'Noto Sans JP','Hiragino Sans',sans-serif",padding:"1.25rem",color:"#1E293B",background:"#F8FAFC",minHeight:"100vh"}}>
      <style>{`
        .imp-input,.imp-select{width:100%;box-sizing:border-box;padding:7px 10px;font-size:14px;border:2px solid #CBD5E1;border-radius:6px;background:#F8FAFC;color:#1E293B;outline:none;transition:border-color .15s,box-shadow .15s;appearance:auto;}
        .imp-input:hover,.imp-select:hover{border-color:#94A3B8;background:#F1F5F9;}
        .imp-input:focus,.imp-select:focus{border-color:#3B82F6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.18);}
        .imp-select{cursor:pointer;}
        .multi-item-row{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
        .zone-badge{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
      `}</style>

      <h2 style={{fontSize:20,fontWeight:700,margin:"0 0 1.25rem",color:"#0F172A"}}>面付け計算ツール</h2>

      <div style={{display:"grid",gridTemplateColumns:"360px 1fr",gap:16,alignItems:"start",height:"calc(100vh - 80px)"}}>

        {/* ── 左：入力パネル（独立スクロール） ── */}
        <div style={{display:"flex",flexDirection:"column",gap:12,height:"100%",overflowY:"auto",paddingRight:4,paddingBottom:16}}>

          {/* 付け合わせモード */}
          <Card>
            <SLabel c="付け合わせモード"/>
            <div style={{display:"flex",gap:6}}>
              <label style={rbStyle(impositionMode==="single")} onClick={()=>setImpositionMode("single")}>単品</label>
              <label style={rbStyle(impositionMode==="multi")} onClick={()=>setImpositionMode("multi")}>複数絵柄の混在</label>
            </div>
          </Card>

          {/* 単品モード：製品サイズ */}
          {impositionMode==="single" && (
            <Card>
              <SLabel c="製品サイズ（仕上がり）"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                <div><FLabel c="幅 (mm)"/>{inp(designW,setDesignW,1)}</div>
                <div><FLabel c="高さ (mm)"/>{inp(designH,setDesignH,1)}</div>
              </div>
              <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:12,color:"#475569"}}>
                <input type="checkbox" checked={rotate90} onChange={e=>setRotate90(e.target.checked)} style={{width:14,height:14}}/>
                90度回転（{rotate90?`${dW}×${dH}mm`:`${designW}×${designH}mm`}→{rotate90?`${designW}×${designH}mm`:`${dH}×${dW}mm`}）
              </label>
            </Card>
          )}

          {/* 紙サイズ */}
          <Card>
            <SLabel c="紙サイズ"/>
            <select className="imp-select" value={paperPreset} onChange={e=>setPaperPreset(Number(e.target.value))} style={{marginBottom:8}}>
              {PAPER_SIZES.map((s,i)=><option key={i} value={i}>{s.label}{s.w?` ${s.w}×${s.h}mm`:""}</option>)}
            </select>
            {preset.w===null && (
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <div><FLabel c="幅 (mm)"/>{inp(customW,setCustomW,1)}</div>
                <div><FLabel c="高さ (mm)"/>{inp(customH,setCustomH,1)}</div>
              </div>
            )}
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
              <span style={{fontSize:11,color:"#94A3B8"}}>紙目</span>
              <label style={rbStyle(grain==="tate")} onClick={()=>setGrain("tate")}>タテ目</label>
              <label style={rbStyle(grain==="yoko")} onClick={()=>setGrain("yoko")}>ヨコ目</label>
              <span style={{fontSize:11,color:"#94A3B8",marginLeft:4}}>{fullW}×{fullH}mm</span>
            </div>
          </Card>

          {/* 断裁 */}
          <Card>
            <SLabel c="断裁"/>

                {inp(copies,setCopies,1)}

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
                      <div>

                      </div>
                      <div>
                        <FLabel c="ドブ (mm)"/>
                        <input type="number" min={0} value={item.bleed} onChange={e=>updateMultiItem(item.id,"bleed",Math.max(0,Number(e.target.value)))} className="imp-input"/>
                      </div>
                      <div>
                        <FLabel c="部数"/>
                        <input type="number" min={1} value={item.copies} onChange={e=>updateMultiItem(item.id,"copies",Math.max(1,Number(e.target.value)))} className="imp-input"/>
                      </div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:6,alignItems:"center",marginBottom:6}}>
                      <div>
                        <FLabel c="横（列数）"/>

                      <div>
                        <FLabel c="縦（行数）"/>

                    </div>
                    <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#64748B",cursor:"pointer"}}>

                    {idx > 0 && (

                          <label style={rbStyle(item.placement==="new_row")} onClick={()=>updateMultiItem(item.id,"placement","new_row")}>↓ 下に並べる</label>
                          <label style={rbStyle(item.placement==="beside")} onClick={()=>updateMultiItem(item.id,"placement","beside")}>→ 横に並べる</label>
                          <label style={rbStyle(item.placement==="above")} onClick={()=>updateMultiItem(item.id,"placement","above")}>↑ 上に積む</label>
                        </div>
                        {item.placement === "above" && (
                          <div style={{marginBottom:8}}>
                            <FLabel c="横位置"/>
                            <div style={{display:"flex",gap:6}}>
                              <label style={rbStyle((item.hAlign??"left")==="left")}   onClick={()=>updateMultiItem(item.id,"hAlign","left")}>左揃え</label>
                              <label style={rbStyle((item.hAlign??"left")==="center")} onClick={()=>updateMultiItem(item.id,"hAlign","center")}>中央</label>
                              <label style={rbStyle((item.hAlign??"left")==="right")}  onClick={()=>updateMultiItem(item.id,"hAlign","right")}>右揃え</label>

                        <input type="number" min={0} step={0.5} value={item.gapBefore ?? 0}

                    )}

              <div style={{marginTop:8}}>
                <FLabel c="ゾーン間の隙間 (mm)"/>

            </Card>

          {/* 余白・送り設定 */}

                        <span style={{fontSize:11,color:"#94A3B8"}}>（最大: 横{result.normal.cols} × 縦{result.normal.rows}）</span>
                      </div>
                    </div>
                    {manualCount>0&&(
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:11,color:"#64748B",marginBottom:2}}>必要用紙</div>
                        <div><span style={{fontSize:28,fontWeight:700}}>{Math.ceil(copies/manualCount).toLocaleString()}</span><span style={{fontSize:13,color:"#64748B",marginLeft:4}}>枚</span><span style={{fontSize:11,color:"#94A3B8",marginLeft:4}}>/{copies.toLocaleString()}部</span></div>
                        <div style={{fontSize:11,color:"#94A3B8"}}>余り {(Math.ceil(copies/manualCount)*manualCount-copies).toLocaleString()}部</div>
                      </div>
                    )}
                  </div>
                  <div style={{height:5,background:"#F1F5F9",borderRadius:3,overflow:"hidden",marginBottom:4}}>
                    <div style={{height:"100%",width:`${Math.min(manualYield,100).toFixed(1)}%`,background:"#3B82F6",borderRadius:3}}/>
                  </div>
                  <div style={{fontSize:11,color:"#94A3B8"}}>歩留まり {manualYield.toFixed(1)}%</div>
                </Card>

                <Card>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <SLabel c="レイアウトプレビュー"/>
                      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#475569",cursor:"pointer",marginBottom:8}}>
                        <input type="checkbox" checked={centerLayout} onChange={e=>setCenterLayout(e.target.checked)} disabled={offsetMode==="manual"} style={{width:14,height:14}}/>

                      </label>
                    </div>
                    <div style={{display:"flex",gap:6,marginBottom:8}}>
                      {[["PNG","png"],["JPEG","jpeg"],["PDF","pdf"]].map(([label,fmt])=>(

                      ))}
                    </div>
                  </div>
                  <div style={{marginBottom:10,padding:"8px 10px",background:"#F8FAFC",borderRadius:6,border:"1px solid #E2E8F0"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:offsetMode==="manual"?10:0}}>
                      <span style={{fontSize:11,color:"#64748B",fontWeight:500}}>空き調整</span>
                      <label style={rbStyle(offsetMode==="auto")} onClick={()=>setOffsetMode("auto")}>自動</label>
                      <label style={rbStyle(offsetMode==="manual")} onClick={()=>setOffsetMode("manual")}>手動</label>
                    </div>
                    {offsetMode==="manual"&&(
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6}}>
                        <div><FLabel c="左空き (mm)"/><input type="number" min={0} step={0.5} value={offsetXmm} onChange={e=>setOffsetXmm(Math.max(0,Number(e.target.value)))} className="imp-input"/>{spareCalc&&<div style={{fontSize:10,color:"#94A3B8",marginTop:2}}>右: {spareCalc.rightMm}mm</div>}</div>

                      {effectiveGrain==="tate" ? <svg width={14} height={10}><line x1={0} y1={3} x2={14} y2={3} stroke="#94A3B8" strokeWidth={1}/><line x1={0} y1={7} x2={14} y2={7} stroke="#94A3B8" strokeWidth={1}/></svg> : <svg width={10} height={14}><line x1={3} y1={0} x2={3} y2={14} stroke="#94A3B8" strokeWidth={1}/><line x1={7} y1={0} x2={7} y2={14} stroke="#94A3B8" strokeWidth={1}/></svg>}

                      ))}

                  </table>

            )

          {/* ── 複数絵柄モード結果 ── */}
          {impositionMode==="multi" && multiLayout && (
            <>
              {/* 全体サマリー */}
              <Card>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <div>
                    <div style={{fontSize:11,color:"#64748B",marginBottom:4}}>複数絵柄 付け合わせ</div>
                    <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                      <span style={{fontSize:11,color:multiLayout.fits?"#16A34A":"#DC2626",fontWeight:600,background:multiLayout.fits?"#F0FDF4":"#FEF2F2",padding:"2px 10px",borderRadius:4}}>
                        {multiLayout.fits ? "✓ 紙に収まります" : "✗ 収まりません"}
                      </span>
                      <span style={{fontSize:12,color:"#64748B"}}>使用高さ: {multiLayout.totalZonesH.toFixed(1)}mm / 有効: {multiLayout.usableH}mm</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:11,color:"#64748B",marginBottom:2}}>必要用紙（最大）</div>
                    <div><span style={{fontSize:28,fontWeight:700}}>{multiLayout.maxSheets.toLocaleString()}</span><span style={{fontSize:13,color:"#64748B",marginLeft:4}}>枚</span></div>
                    <div style={{fontSize:11,color:"#94A3B8"}}>最も多く必要な絵柄が基準</div>
                  </div>
                </div>
                {/* 残り高さバー */}
                <div style={{height:6,background:"#F1F5F9",borderRadius:3,overflow:"hidden",marginBottom:4}}>
                  <div style={{height:"100%",width:`${Math.min(100,multiLayout.totalZonesH/multiLayout.usableH*100).toFixed(1)}%`,background:multiLayout.fits?"#3B82F6":"#EF4444",borderRadius:3}}/>
                </div>
                <div style={{fontSize:11,color:"#94A3B8"}}>
                  余白: {multiLayout.spareH.toFixed(1)}mm（有効高さの{multiLayout.usableH>0?(multiLayout.spareH/multiLayout.usableH*100).toFixed(1):0}%）
                </div>
              </Card>

              {/* プレビュー */}
              <Card>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                  <SLabel c="レイアウトプレビュー"/>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {multiLayout.zones.map((zone,zi)=>(
                      <span key={zone.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:11}}>
                        <span style={{display:"inline-block",width:10,height:10,background:zone.color.fill,border:`1.5px solid ${zone.color.stroke}`,borderRadius:2}}/>
                        {zone.name}
                      </span>
                    ))}
                  </div>
                </div>
                <MultiLayoutPreview paperW={paperW} paperH={paperH} multiLayout={multiLayout} kuwae={kuwae} kuwaeJiri={kuwaeJiri} marginLR={marginLR} gutterH={gutterH} gutterV={gutterV} zoneGap={zoneGap} grain={effectiveGrain}/>
              </Card>

              {/* 絵柄別結果 */}
              <Card>
                <SLabel c="絵柄別 結果"/>
                <table style={{width:"100%",fontSize:12,borderCollapse:"collapse"}}>
                  <thead><tr>
                    <th style={{textAlign:"left",color:"#94A3B8",fontWeight:400,paddingBottom:8,borderBottom:"1px solid #F1F5F9"}}>絵柄</th>
                    <th style={{textAlign:"right",color:"#94A3B8",fontWeight:400,paddingBottom:8,borderBottom:"1px solid #F1F5F9"}}>サイズ</th>
                    <th style={{textAlign:"right",color:"#94A3B8",fontWeight:400,paddingBottom:8,borderBottom:"1px solid #F1F5F9"}}>面付け</th>
                    <th style={{textAlign:"right",color:"#94A3B8",fontWeight:400,paddingBottom:8,borderBottom:"1px solid #F1F5F9"}}>必要枚数</th>
                    <th style={{textAlign:"right",color:"#94A3B8",fontWeight:400,paddingBottom:8,borderBottom:"1px solid #F1F5F9"}}>余り</th>
                  </tr></thead>
                  <tbody>
                    {multiLayout.zones.map((zone,zi)=>(
                      <tr key={zone.id}>
                        <td style={{padding:"8px 0",borderBottom:"1px solid #F8FAFC"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{display:"inline-block",width:10,height:10,background:zone.color.fill,border:`1.5px solid ${zone.color.stroke}`,borderRadius:2}}/>
                            <span style={{fontWeight:500}}>{zone.name}</span>
                          </div>
                        </td>
                        <td style={{textAlign:"right",padding:"8px 0",borderBottom:"1px solid #F8FAFC",color:"#64748B"}}>{zone.dW}×{zone.dH}mm{zone.bleed>0?<span style={{color:"#94A3B8",fontSize:10}}> +{zone.bleed}</span>:""}</td>
                        <td style={{textAlign:"right",padding:"8px 0",borderBottom:"1px solid #F8FAFC"}}>横{zone.cols}×縦{zone.rows}<span style={{color:"#94A3B8",marginLeft:4}}>={zone.count}面</span></td>
                        <td style={{textAlign:"right",padding:"8px 0",borderBottom:"1px solid #F8FAFC",fontWeight:zone.sheetsNeeded===multiLayout.maxSheets?600:400,color:zone.sheetsNeeded===multiLayout.maxSheets?"#0F172A":"#475569"}}>
                          {zone.sheetsNeeded.toLocaleString()}枚
                          <div style={{fontSize:10,color:"#94A3B8"}}>{zone.copies.toLocaleString()}部</div>
                        </td>
                        <td style={{textAlign:"right",padding:"8px 0",borderBottom:"1px solid #F8FAFC",color:"#94A3B8",fontSize:11}}>
                          {zone.sheetsNeeded===multiLayout.maxSheets ? (
                            <span style={{color:"#F59E0B",fontWeight:500}}>基準</span>
                          ) : (
                            `+${(multiLayout.maxSheets*zone.count-zone.copies).toLocaleString()}部`
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {multiLayout.maxSheets>0&&(
                  <div style={{marginTop:10,padding:"8px 12px",background:"#F8FAFC",borderRadius:6,fontSize:12,color:"#475569"}}>
                    💡 <b>必要用紙 {multiLayout.maxSheets.toLocaleString()}枚</b>で全絵柄を印刷できます。「基準」以外の絵柄は余りが発生します。
                  </div>
                )}
              </Card>
            </>
          )}

          {impositionMode==="multi"&&!multiLayout&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:200,color:"#94A3B8",fontSize:13}}>左の設定を確認してください</div>
          )}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
